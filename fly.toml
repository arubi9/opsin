app = 'opsin-structure-mcp'
primary_region = 'iad'

[build]
  dockerfile = 'mcp/Dockerfile'

[env]
  PUBLIC_HOST = 'opsin-structure-mcp.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 2
    hard_limit = 4

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
